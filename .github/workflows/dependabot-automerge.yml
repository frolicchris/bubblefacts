name: Dependabot auto-merge

# Patch updates to development tools and workflow actions merge on their own
# once every required check passes. They don't change what musicians
# install. Anything that ships in the app (runtime packages, Electron), and
# every minor or major update, waits for a person (docs/RELEASING.md).
# Needs "Allow auto-merge" on in the repository settings.

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Turn on auto-merge for a dev-tool or action patch update
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' &&
          (steps.meta.outputs.dependency-type == 'direct:development' ||
           steps.meta.outputs.package-ecosystem == 'github_actions' || steps.meta.outputs.package-ecosystem == 'github-actions')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR"
