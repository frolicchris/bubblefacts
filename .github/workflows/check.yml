name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The checks don't run the desktop app, so skip downloading Electron itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Typecheck, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # shellcheck comes preinstalled on GitHub's Ubuntu runners.
      - run: npm run check
      - run: npm run build

  # The desktop app ships on macOS and Windows too: run the tests there, where
  # paths, line endings and file locking differ.
  other-systems:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run build:desktop

  # The one check main's ruleset requires, so renaming or adding a matrix entry
  # above can't leave pull requests waiting on a check that no longer runs.
  ci-ok:
    name: ci-ok
    needs: [check, other-systems]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: test "${{ needs.check.result }}" = success && test "${{ needs.other-systems.result }}" = success
