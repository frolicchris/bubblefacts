name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The checks don't run the desktop app, so skip downloading Electron itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Typecheck, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # shellcheck comes preinstalled on GitHub's Ubuntu runners.
      - run: npm run check
      - run: npm run build

  # The desktop app ships on macOS and Windows too: run the tests there, where
  # paths, line endings and file locking differ.
  other-systems:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run build:desktop
