name: Smoke test

# Installs a published release the way a streamer would, on each system, and
# checks the installed app: first that it starts exactly as shipped, then its
# server starts and serves the overlay, and the built-in AI loads (GPU if
# there is one, then processor-only).
# It starts by itself when a Release run finishes successfully, on that run's
# artifacts. To test a release again, use Actions > Smoke test > Run workflow.

on:
  # Runs the copy of this file on the default branch, whichever branch or tag
  # the Release run built; the test scripts it checks out are that build's own.
  # There are no inputs here: the run ID comes from the event.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test, such as v2.0.0-beta.2 (empty means the newest release, betas included)
        required: false
      run:
        description: Or a Release workflow run ID, to test unpublished builds from its artifacts
        required: false

permissions:
  contents: read
  actions: read # download another run's artifacts

env:
  MODEL_URL: https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/5ab33fa94d1d04e903623ae72c95d1696f09f9e8/Llama-3.2-3B-Instruct-Q4_K_M.gguf
  MODEL_SHA256: 6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff

jobs:
  smoke:
    name: Smoke test (${{ matrix.name }})
    # A Release run that failed or was cancelled has nothing worth testing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The names end in the version and then the system ("2.2.0-mac-arm64.dmg"). "*[0-9]-" also skips
        # the "-lite" installers of the 2.2.0 releases, which BubbleFacts Lite's last builds left in them.
        include:
          - { name: windows, os: windows-latest, asset: "*[0-9]-windows-x64.exe", artifact: windows-x64 }
          - { name: linux-deb, os: ubuntu-24.04, asset: "bubblefacts_*_amd64.deb", artifact: linux-x64 }
          - { name: linux-appimage, os: ubuntu-24.04, asset: "*[0-9]-linux-x86_64.AppImage", artifact: linux-x64, appimage: true }
          - { name: mac-arm64, os: macos-15, asset: "*[0-9]-mac-arm64.dmg", artifact: mac-arm64 }
          - { name: mac-x64, os: macos-15-intel, asset: "*[0-9]-mac-x64.dmg", artifact: mac-x64 }
    env:
      GH_TOKEN: ${{ github.token }}
      SMOKE_ARG: model.gguf
    defaults:
      run:
        shell: bash
    steps:
      # Inputs go through env, never straight into the script: no shell injection.
      - name: Pick the release
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RUN_INPUT: ${{ inputs.run || github.event.workflow_run.id }}
        run: |
          tag="$TAG_INPUT"
          if [ -n "$RUN_INPUT" ]; then tag="run $RUN_INPUT"; fi
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.draft|not)][0].tag_name')
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Testing $tag"
      - name: Download the installer
        env:
          RUN_INPUT: ${{ inputs.run || github.event.workflow_run.id }}
        run: |
          if [ -n "$RUN_INPUT" ]; then
            gh run download "$RUN_INPUT" --repo "$GITHUB_REPOSITORY" --name "${{ matrix.artifact }}" --dir all
            mkdir -p installer && find all -name "${{ matrix.asset }}" -exec cp {} installer/ \;
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.asset }}" --dir installer
          fi
          ls -la installer
          if [ -z "$(ls installer)" ]; then echo "No installer named ${{ matrix.asset }} in $TAG"; exit 1; fi
      - name: Restore the AI model
        id: model
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: model.gguf
          key: model-${{ env.MODEL_SHA256 }}
      - name: Download the AI model
        run: |
          [ -f model.gguf ] || curl -sSL -o model.gguf "$MODEL_URL"
          # Git Bash on Windows has sha256sum; macOS has shasum.
          if command -v sha256sum >/dev/null; then echo "$MODEL_SHA256  model.gguf" | sha256sum -c -; else echo "$MODEL_SHA256  model.gguf" | shasum -a 256 -c -; fi
      - name: Keep the AI model for the next run
        # Saved now, checked, before the build's own scripts are checked out below: nothing they run can reach the cache.
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: model.gguf
          key: model-${{ env.MODEL_SHA256 }}

      # The test scripts of the build being tested, got the way its installer is: from the Release
      # run's artifacts (Release uploads scripts/smoke-*.mjs as "smoke-scripts"), or from the tag
      # of a published release. Nothing is checked out: this job holds the default branch's cache,
      # and code scanning reads a checkout of another commit here as a way to poison it.
      - name: Get that build's test scripts
        env:
          RUN_INPUT: ${{ inputs.run || github.event.workflow_run.id }}
        run: |
          rm -rf scripts && mkdir -p scripts
          if [ -n "$RUN_INPUT" ]; then
            gh run download "$RUN_INPUT" --repo "$GITHUB_REPOSITORY" --name smoke-scripts --dir scripts
          else
            for f in smoke-packaged.mjs smoke-llama-debug.mjs; do
              gh api "repos/$GITHUB_REPOSITORY/contents/scripts/$f?ref=$TAG" -H "Accept: application/vnd.github.raw" > "scripts/$f"
            done
          fi
          ls -la scripts
          [ -s scripts/smoke-packaged.mjs ] || { echo "No smoke test scripts for $TAG"; exit 1; }

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $exe.FullName -ArgumentList "/S"
          $dir = Join-Path $env:LOCALAPPDATA "Programs\BubbleFacts"
          if (-not (Test-Path "$dir\BubbleFacts.exe")) { throw "Not installed where expected: $dir" }
          "APP_EXE=$dir\BubbleFacts.exe" | Out-File -Append $env:GITHUB_ENV
          "APP_RESOURCES=$dir\resources" | Out-File -Append $env:GITHUB_ENV
      - name: Install (Linux AppImage)
        if: matrix.appimage
        run: |
          # An AppImage mounts itself with FUSE 2; the test's own copy is unpacked from it.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2t64 xvfb
          image=$(ls "$PWD"/installer/*.AppImage)
          chmod +x "$image"
          (cd installer && "$image" --appimage-extract >/dev/null)
          [ -x installer/squashfs-root/bubblefacts ] || { ls installer/squashfs-root; exit 1; }
          echo "APP_LAUNCH=$image" >> "$GITHUB_ENV"
          echo "APP_EXE=$PWD/installer/squashfs-root/bubblefacts" >> "$GITHUB_ENV"
          echo "APP_RESOURCES=$PWD/installer/squashfs-root/resources" >> "$GITHUB_ENV"
      - name: Install (Linux)
        if: runner.os == 'Linux' && !matrix.appimage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./installer/*.deb xvfb
          res=$(dpkg -L bubblefacts | grep -m1 -E '/resources$')
          exe=$(dirname "$res")/bubblefacts
          [ -x "$exe" ] || { dpkg -L bubblefacts | head -40; exit 1; }
          echo "APP_EXE=$exe" >> "$GITHUB_ENV"
          echo "APP_RESOURCES=$res" >> "$GITHUB_ENV"
      - name: Install (Mac)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/bf installer/*.dmg
          mkdir -p "$HOME/Applications"
          cp -R /tmp/bf/BubbleFacts.app "$HOME/Applications/"
          echo "APP_EXE=$HOME/Applications/BubbleFacts.app/Contents/MacOS/BubbleFacts" >> "$GITHUB_ENV"
          echo "APP_RESOURCES=$HOME/Applications/BubbleFacts.app/Contents/Resources" >> "$GITHUB_ENV"

      - name: Start the app as shipped
        # Before anything below changes it: the app a streamer gets must open and start its fact
        # server. Setup is marked done (a now playing file, Ollama) so the server starts; on Linux
        # it runs under the bundled Node.js, which RunAsNode being off once stopped (2.0.0 to 2.2.0-beta.2).
        shell: bash
        run: |
          ud="$RUNNER_TEMP/bf-launch"; flag="$ud"
          [ "$RUNNER_OS" = Windows ] && { ud=$(cygpath -u "$RUNNER_TEMP")/bf-launch; flag=$(cygpath -w "$ud"); }
          mkdir -p "$ud"
          echo "Tidewater Reel - The Example Band" > "$ud/now-playing.txt"
          node -e 'const [dir, file] = process.argv.slice(1); require("fs").writeFileSync(require("path").join(dir, "settings.json"), JSON.stringify({ setupComplete: true, songSource: "nowplaying", nowPlayingPreset: "none", nowPlayingFile: file, ai: "ollama" }))' "$ud" "$flag/now-playing.txt"
          [ "$RUNNER_OS" = macOS ] && codesign --verify --deep --strict "$HOME/Applications/BubbleFacts.app"
          app="${APP_LAUNCH:-$APP_EXE}"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$app" --no-sandbox "--user-data-dir=$flag" > launch.txt 2>&1 &
          else "$app" "--user-data-dir=$flag" > launch.txt 2>&1 &
          fi
          for _ in $(seq 1 90); do grep -qs "\[Server\] Listening" "$ud"/logs/*.log && break; sleep 1; done
          cat "$ud"/logs/*.log 2>/dev/null; tail -20 launch.txt
          ok=0; grep -qs "\[Server\] Listening" "$ud"/logs/*.log && ok=1
          case "$RUNNER_OS" in
            Windows) taskkill //IM BubbleFacts.exe //F //T >/dev/null 2>&1 || true ;;
            *) pkill -f "bf-launch" || true ;;
          esac
          [ "$ok" = 1 ] || { echo "The app as shipped didn't start its fact server"; exit 1; }
      - name: Let the test run the app as Node.js
        # The app as shipped refuses to (electronFuses in package.json), so another
        # program can't borrow it to read the streamer's saved keys. This copy is only for the test.
        shell: bash
        run: |
          app="$APP_EXE"; [ "$RUNNER_OS" = macOS ] && app="$HOME/Applications/BubbleFacts.app"
          fuses() { if [ "$RUNNER_OS" = Linux ]; then sudo env "PATH=$PATH" npx --yes @electron/fuses@1.8.0 "$@"; else npx --yes @electron/fuses@1.8.0 "$@"; fi; }
          fuses read --app "$app" | tee fuses.txt
          grep -q "RunAsNode is Disabled" fuses.txt || { echo "The shipped app still runs as Node.js"; exit 1; }
          fuses write --app "$app" RunAsNode=on
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --deep --sign - "$app"; fi

      - name: Describe the processor
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"
                     powershell -NoProfile -Command "Add-Type -MemberDefinition '[DllImport(\"kernel32.dll\")] public static extern bool IsProcessorFeaturePresent(uint f);' -Name K -Namespace W; 'AVX-512 (feature 41): ' + [W.K]::IsProcessorFeaturePresent(41)" ;;
            Linux)   grep -m1 'model name' /proc/cpuinfo; grep -m1 -o 'avx512f' /proc/cpuinfo || echo "no avx512f" ;;
            macOS)   sysctl -n machdep.cpu.brand_string ;;
          esac
      - name: Run the smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed app's output only reaches the log when redirected.
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath $env:APP_EXE -ArgumentList @("scripts/smoke-packaged.mjs", "`"$env:APP_RESOURCES`"", $env:SMOKE_ARG) -NoNewWindow -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt, err.txt
          exit $p.ExitCode
      - name: Run the smoke test (Linux and Mac)
        if: runner.os != 'Windows'
        run: ELECTRON_RUN_AS_NODE=1 "$APP_EXE" scripts/smoke-packaged.mjs "$APP_RESOURCES" "$SMOKE_ARG"

      - name: Diagnose the built-in AI (Linux, only when the test failed)
        if: failure() && runner.os == 'Linux'
        run: |
          set +e
          echo "--- libraries the AI's native files can't find"
          find "$APP_RESOURCES" \( -name '*.node' -o -name '*.so' \) -print0 | xargs -0 -n1 ldd 2>/dev/null | grep 'not found'
          echo "--- CPU"
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512.*|fma|f16c|bmi2|amx.*|avx_vnni)$' | tr '\n' ' '; echo
          echo "--- the installed app, loading node-llama-cpp directly"
          ELECTRON_RUN_AS_NODE=1 "$APP_EXE" scripts/smoke-llama-debug.mjs "$APP_RESOURCES" model.gguf 2>&1 | tail -40
          echo "exit status ${PIPESTATUS[0]}"
          echo "--- the same node-llama-cpp under plain Node.js, outside the app"
          mkdir -p /tmp/plain && cd /tmp/plain && npm init -y >/dev/null && npm install --silent node-llama-cpp@$(node -p "require('$APP_RESOURCES/app.asar.unpacked/node_modules/@node-llama-cpp/linux-x64/package.json').version" 2>/dev/null || echo latest) >/dev/null 2>&1
          mkdir -p res/app.asar && ln -s /tmp/plain/node_modules res/app.asar/node_modules
          node "$GITHUB_WORKSPACE/scripts/smoke-llama-debug.mjs" /tmp/plain/res "$GITHUB_WORKSPACE/model.gguf" 2>&1 | tail -40
          echo "exit status ${PIPESTATUS[0]}"
          echo "--- the installed app's own server under plain Node.js (is it Electron's runtime?)"
          cd /tmp && npx --yes @electron/asar@3.4.1 extract "$APP_RESOURCES/app.asar" /tmp/extracted >/dev/null
          cp -R "$APP_RESOURCES/app.asar.unpacked/." /tmp/extracted/
          mkdir -p /tmp/plainres/app.asar && cp -R /tmp/extracted/. /tmp/plainres/app.asar/
          node "$GITHUB_WORKSPACE/scripts/smoke-packaged.mjs" /tmp/plainres "$GITHUB_WORKSPACE/model.gguf" 2>&1 | grep -E "PASS|FAIL|WARN|signal" | head -10
          echo "exit status ${PIPESTATUS[0]}"
          echo "--- experiment: the app's own runtime with the AVX-512 builds of the AI removed"
          mkdir -p /tmp/noavx && cp -R "$APP_RESOURCES/." /tmp/noavx/
          find /tmp/noavx -name 'libggml-cpu-*.so' | grep -E 'zen4|sapphirerapids|cooperlake|cannonlake|cascadelake|icelake|skylakex' | xargs rm -f
          ELECTRON_RUN_AS_NODE=1 "$APP_EXE" "$GITHUB_WORKSPACE/scripts/smoke-llama-debug.mjs" /tmp/noavx "$GITHUB_WORKSPACE/model.gguf" 2>&1 | grep -E "\[debug\]|loaded CPU backend|load_backend" | head -8
          echo "exit status ${PIPESTATUS[0]}"
