name: Triage

# Labels new issues from their form answers (computer, and app or manual
# setup), so reports can be filtered by platform.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || "";
            const answer = (heading) => {
              const m = body.match(new RegExp(`###\\s*${heading}\\s*\\n+([^\\n]+)`, "i"));
              return m ? m[1].trim() : "";
            };
            const labels = [];
            const platform = { macOS: "platform: macOS", Windows: "platform: Windows", Linux: "platform: Linux" }[answer("Computer")];
            if (platform) labels.push(platform);
            const install = answer("How you run BubbleFacts");
            if (/desktop app/i.test(install)) labels.push("desktop app");
            if (/manual setup/i.test(install)) labels.push("manual setup");
            if (labels.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels });
            }
