name: Release

# Pushing a version tag (v2.0.0, v2.0.0-beta.1) builds every installer on its
# own system and puts them in a *draft* release with checksums, for a person to
# read over and publish. Each file gets a build-provenance attestation, so
# anyone can check it came from this workflow:
#   gh attestation verify FILE --repo frolicchris/bubblefacts \
#     --signer-workflow frolicchris/bubblefacts/.github/workflows/release.yml --source-ref refs/tags/vX.Y.Z
# (test builds from workflow_dispatch are attested too; --source-ref tells a real release apart)

on:
  push:
    tags: ["v*"]
  # Test builds without a release: Actions > Release > Run workflow. The
  # installers appear as downloadable artifacts on the run. Works in forks too.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-14, args: --mac --arm64 }
          # The AI's native files for Intel Macs only install on an Intel machine.
          - { name: mac-x64, os: macos-15-intel, args: --mac --x64 }
          - { name: windows-x64, os: windows-latest, args: --win --x64 }
          # The oldest supported Ubuntu, so the Linux build runs on everything newer.
          - { name: linux-x64, os: ubuntu-22.04, args: --linux --x64 }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      # Linux runs the fact server under a standard Node.js (see desktop/src/supervisor.ts):
      # ship the official one setup-node just installed.
      - name: Bundle Node.js for the fact server (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p desktop/runtime && cp "$(node -p 'process.execPath')" desktop/runtime/node && desktop/runtime/node --version
      # The YouTube Data API key is a repository secret, written into the build only (never committed).
      # It's restricted to the YouTube Data API. Without it, song titles are read from the video title alone.
      - name: Add the YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        if: env.YOUTUBE_API_KEY != ''
        shell: bash
        run: node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.bubblefacts.youtubeApiKey=process.env.YOUTUBE_API_KEY;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      # Signing happens only when its secrets are set (see "Code signing" in CONTRIBUTING.md).
      # Without them, as in forks, builds are unsigned: the Mac app gets an ad-hoc
      # signature (desktop/scripts/after-pack.js) and Windows shows its usual warning.
      - name: Signing setup
        id: signing
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CERT_P12_BASE64" ]; then
              echo "CSC_LINK=$MAC_CERT_P12_BASE64" >> "$GITHUB_ENV"
              if [ -n "$APPLE_API_KEY_P8" ]; then
                key="$RUNNER_TEMP/apple-api-key.p8"
                printf '%s' "$APPLE_API_KEY_P8" > "$key"
                echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
              fi
              echo "Mac build: signed with the Developer ID certificate${APPLE_API_KEY_P8:+, and notarized}"
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "Mac build: unsigned (no MAC_CERT_P12_BASE64 secret)"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
              extra="-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT -c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT -c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
              echo "Windows build: signed with Azure Trusted Signing"
            else
              echo "Windows build: unsigned (no Azure signing secrets)"
            fi
          fi
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          EXTRA: ${{ steps.signing.outputs.extra }}
          ARGS: ${{ matrix.args }}
        run: |
          # $ARGS and $EXTRA are split into words on purpose.
          if [ -n "$EXTRA" ]; then
            npm run dist -- $ARGS $EXTRA "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
          else
            npm run dist -- $ARGS
          fi
      # Says in the log whether each installer came out signed.
      - name: Report signing
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) for a in release/mac*/BubbleFacts.app; do codesign -dv "$a" 2>&1 | grep -E "Authority|Signature=adhoc" || true; done ;;
            Windows) powershell -Command "Get-AuthenticodeSignature (Get-ChildItem release/BubbleFacts-*.exe) | Format-List Status,SignerCertificate" ;;
          esac
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/BubbleFacts-*.dmg
            release/BubbleFacts-*.exe
            release/BubbleFacts-*.AppImage
            release/bubblefacts_*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/BubbleFacts-*.dmg
            release/BubbleFacts-*.exe
            release/BubbleFacts-*.AppImage
            release/bubblefacts_*.deb

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      # The manual (command-line) setup: docs/MANUAL-SETUP.md links to this name on the latest release.
      - name: Source zip
        run: git archive --format=zip --prefix=bubblefacts/ -o files/bubblefacts.zip "$GITHUB_REF_NAME"
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            files/bubblefacts.zip
            files/SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checksums go in the notes too: the website's download checker reads them there.
          # The draft starts from the release template's sections (New, Improved, Fixed, Thanks),
          # to be filled in before publishing.
          { cat .github/release-template.md; echo
            echo "### SHA-256 checksums"; echo '```'; cat files/SHA256SUMS.txt; echo '```'; } > notes.md
          flags="--draft --generate-notes --notes-file notes.md --title ${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" $flags
