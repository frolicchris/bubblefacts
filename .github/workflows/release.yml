name: Release

# Pushing a version tag (v2.0.0, v2.0.0-beta.1) builds every installer on its
# own system and puts them in a *draft* release with checksums, for a person to
# read over and publish. Each file gets a build-provenance attestation, so
# anyone can check it came from this workflow:
#   gh attestation verify FILE --repo frolicchris/bubblefacts \
#     --signer-workflow frolicchris/bubblefacts/.github/workflows/release.yml --source-ref refs/tags/vX.Y.Z
# (test builds from workflow_dispatch are attested too; --source-ref tells a real release apart)

on:
  push:
    tags: ["v*"]
  # Test builds without a release: Actions > Release > Run workflow. The
  # installers appear as downloadable artifacts on the run. Works in forks too.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-14, args: --mac --arm64 }
          # The AI's native files for Intel Macs only install on an Intel machine.
          - { name: mac-x64, os: macos-15-intel, args: --mac --x64 }
          - { name: windows-x64, os: windows-latest, args: --win --x64 }
          # The oldest supported Ubuntu, so the Linux build runs on everything newer.
          - { name: linux-x64, os: ubuntu-22.04, args: --linux --x64 }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      # Linux runs the fact server under a standard Node.js (see desktop/src/supervisor.ts):
      # ship the official one setup-node just installed.
      - name: Bundle Node.js for the fact server (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p desktop/runtime && cp "$(node -p 'process.execPath')" desktop/runtime/node && desktop/runtime/node --version
      # The YouTube Data API key is a repository secret, written into the build only (never committed).
      # It's restricted to the YouTube Data API. Without it, song titles are read from the video title alone.
      - name: Add the YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        if: env.YOUTUBE_API_KEY != ''
        shell: bash
        run: node -e 'const f="package.json",p=JSON.parse(require("fs").readFileSync(f));p.bubblefacts.youtubeApiKey=process.env.YOUTUBE_API_KEY;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
      - run: npm run dist -- ${{ matrix.args }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/BubbleFacts-*.dmg
            release/BubbleFacts-*.exe
            release/BubbleFacts-*.AppImage
            release/bubblefacts_*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/BubbleFacts-*.dmg
            release/BubbleFacts-*.exe
            release/BubbleFacts-*.AppImage
            release/bubblefacts_*.deb

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      # The manual (command-line) setup: docs/MANUAL-SETUP.md links to this name on the latest release.
      - name: Source zip
        run: git archive --format=zip --prefix=bubblefacts/ -o files/bubblefacts.zip "$GITHUB_REF_NAME"
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            files/bubblefacts.zip
            files/SHA256SUMS.txt
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checksums go in the notes too: the website's download checker reads them there.
          { echo "Download BubbleFacts at https://bubblefacts.frolic.org/download.html"; echo
            echo "### SHA-256 checksums"; echo '```'; cat files/SHA256SUMS.txt; echo '```'; } > notes.md
          flags="--draft --generate-notes --notes-file notes.md --title ${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" $flags
