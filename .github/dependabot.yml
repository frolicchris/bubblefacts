version: 2
updates:
  # Workflow actions, monthly. Patch updates merge on their own once CI passes (dependabot-automerge.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # npm dependencies. Security fixes (on in the repository settings) come as one grouped pull
  # request against main; version updates are grouped weekly. Electron majors are a manual
  # upgrade (they change the runtime). What may ship in a maintenance release: docs/RELEASING.md.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
    # Electron's major versions stay manual. Security fixes aren't affected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
