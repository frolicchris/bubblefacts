version: 2
updates:
  # Keep the workflow actions current; npm security fixes are on in the repository settings.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm dependencies, grouped weekly. Electron majors are a manual upgrade (they change the runtime).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
