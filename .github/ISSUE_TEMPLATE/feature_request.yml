name: Idea or feature request
description: Something the overlay could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help your stream?
      description: The situation you're in helps more than a proposed solution.
