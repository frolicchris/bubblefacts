name: Beta test report
description: Tried a beta? Tell us how it went. Takes about two minutes.
title: "Beta test: "
labels: [beta test, desktop app]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Set it up, play a song or two, then fill this in. "Everything worked" is a great report too.

        **In the app?** Open **Help and troubleshooting** and click **Send a beta test report**: it fills in the first five answers for you.

        Never paste a token or API key here.
  - type: dropdown
    id: version
    attributes:
      label: BubbleFacts version
      description: Shown at the bottom of the app.
      # Newest first. Add each new beta at the top when it's published.
      options:
        - 2.0.0-beta.7
        - 2.0.0-beta.5
        - 2.0.0-beta.4
        - 2.0.0-beta.3
        - 2.0.0-beta.2
        - 2.0.0-beta.1
        - Another version or not sure
      default: 0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Mac with Apple silicon (M1 or newer)
        - Mac with Intel
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: download
    attributes:
      label: What you installed
      options:
        - Mac installer (.dmg)
        - Windows installer (.exe)
        - Linux AppImage
        - Linux .deb package
        - Not sure
  - type: dropdown
    id: source
    attributes:
      label: Your song requests
      options:
        - StreamerSongList
        - StreamElements
  - type: input
    id: osversion
    attributes:
      label: System version (optional)
      placeholder: macOS 15.3, Windows 11, Ubuntu 24.04…
  - type: dropdown
    id: obs
    attributes:
      label: OBS version
      description: In OBS, Help > About.
      options:
        - 32.2 (newest)
        - 32.0 or 32.1
        - 31 or older
        - Not sure
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      description: Check what worked. Leave a box empty if it didn't, or you didn't try it.
      options:
        - label: Installing and opening it the first time
        - label: Connecting your song requests
        - label: Dragging it into OBS, and seeing the test bubble
        - label: Fact bubbles appearing when a song played
        - label: The dashboard (what's playing, its facts and their sources)
        - label: Wrong, Undo, or Add facts for this song
        - label: Closing the window and quitting from the menu bar or tray
  - type: dropdown
    id: feel
    attributes:
      label: Would you keep it on your stream?
      options:
        - Yes, I love it
        - Yes, with a few fixes
        - Not yet
        - Not sure yet
  - type: textarea
    id: liked
    attributes:
      label: Best moment (optional)
      placeholder: A fact your chat loved, something that was easier than you expected…
  - type: textarea
    id: notes
    attributes:
      label: What didn't work, or was confusing
      placeholder: Which step, what you expected, and what happened. Screenshots help.
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The app adds this for you. Otherwise, Help and troubleshooting > Show logs, and paste the end of today's file.
      render: text
