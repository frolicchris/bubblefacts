name: A fact is wrong
description: A bubble showed something untrue, or about the wrong song.
labels: [wrong fact]
body:
  - type: markdown
    attributes:
      value: |
        Accuracy is the point of this project, so these reports are especially useful. In the app, click **Wrong** next to the fact, then **Report it (opens GitHub)**, and this form is filled in for you.

        This form is for facts from Wikipedia, Wikidata or MusicBrainz. Your own custom facts and the example topic packs aren't checked by BubbleFacts; edit them in the app's Settings instead.
  - type: input
    id: song
    attributes:
      label: Song
      description: The title and artist as they appear in your StreamerSongList queue, or the YouTube title of the StreamElements request.
      placeholder: "Sunshine Coastline — Ys VIII: Lacrimosa of Dana"
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: The fact that was shown
      description: Copy it exactly if you can.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What's actually true, and your source
      description: A link to where the correct information is, if you have one.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of mistake?
      options:
        - It's about a different song, game or artist
        - It's about the right song, but it's wrong
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BubbleFacts version (optional)
      description: The app fills this in. Otherwise, it's at the bottom of the app's window.
  - type: textarea
    id: log
    attributes:
      label: Log lines (optional)
      description: The lines starting with `[Grounding]` and `[Screen]` for that song, from the newest log file (in the app, **Show logs** under **Help and troubleshooting**). They show which article was used.
      render: text
