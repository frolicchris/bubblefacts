name: Something isn't working
description: The app or overlay crashes, shows nothing, or behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Never paste a StreamerSongList or StreamElements token, or an API key, here.** If you share a log, check it first.

        If a fact on screen is wrong, use the "A fact is wrong" form instead.

        **Using the app?** Open **Help and troubleshooting** on its dashboard and click **Report a problem** instead: it fills in this form for you, with your version, system and log, and removes secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps that lead to the problem, if you know them.
  - type: input
    id: version
    attributes:
      label: BubbleFacts version
      description: In the app, it's at the bottom of the window, for example 2.0.0-beta.12. The app fills this in for you.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run BubbleFacts
      options: [The desktop app, Manual setup (command line)]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: System version
      description: For example "macOS 15.3, Apple silicon", "Windows 11", or "Ubuntu 24.04".
  - type: input
    id: obs
    attributes:
      label: OBS version
      description: In OBS, Help > About. For example 32.0.2.
  - type: dropdown
    id: ai
    attributes:
      label: Where the AI runs
      options: [Built into the app, Ollama on my computer, Groq, Anthropic, OpenRouter, Gemini, Other or not sure]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The app fills this in. With the manual setup, paste the relevant lines from the newest file in the `logs` folder, and remove your token first.
      render: text
